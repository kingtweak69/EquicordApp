workflows:
  ios-equicord:
    name: Equicord iOS
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: codemagic

    environment:
      xcode: latest
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.kingtweak69.EquicordApp

    scripts:
      - name: Install XcodeGen
        script: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

      - name: Generate Xcode project
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          xcodegen generate --spec project.yml
          test -f EquicordApp.xcodeproj/project.pbxproj

      - name: Set up iOS code signing
        script: |
          set -euo pipefail
          xcode-project use-profiles

      - name: Build archive
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"

          rm -rf build/EquicordApp.xcarchive build/ipa
          mkdir -p build/ipa

          xcodebuild \
            -project EquicordApp.xcodeproj \
            -scheme EquicordApp \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$CM_BUILD_DIR/build/EquicordApp.xcarchive" \
            clean archive

          test -d "$CM_BUILD_DIR/build/EquicordApp.xcarchive"

      - name: Export IPA
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"

          xcodebuild \
            -exportArchive \
            -archivePath "$CM_BUILD_DIR/build/EquicordApp.xcarchive" \
            -exportPath "$CM_BUILD_DIR/build/ipa" \
            -exportOptionsPlist "$HOME/export_options.plist"

          IPA_PATH="$(find "$CM_BUILD_DIR/build/ipa" -maxdepth 1 -type f -name '*.ipa' -print -quit)"

          test -n "$IPA_PATH"

          cp "$IPA_PATH" "$CM_BUILD_DIR/build/ipa/EquicordApp.ipa"

          echo "IPA created:"
          ls -lh "$CM_BUILD_DIR/build/ipa/EquicordApp.ipa"

    artifacts:
      - build/ipa/EquicordApp.ipa
      - build/EquicordApp.xcarchive
      - build/Build/**/*.app


  ios-equicord-unsigned:
    name: Equicord iOS (unsigned CI check)
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      xcode: latest

    scripts:
      - name: Install XcodeGen
        script: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

      - name: Generate Xcode project
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          xcodegen generate --spec project.yml
          test -f EquicordApp.xcodeproj/project.pbxproj

      - name: Build unsigned app
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"

          xcodebuild \
            -project EquicordApp.xcodeproj \
            -scheme EquicordApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$CM_BUILD_DIR/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

          test -d "$CM_BUILD_DIR/build/Build/Products/Release-iphoneos/EquicordApp.app"

    artifacts:
      - build/Build/Products/Release-iphoneos/EquicordApp.app