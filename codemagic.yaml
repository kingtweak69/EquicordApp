workflows:
  ios-equicord-unsigned:
    name: Equicord iOS (unsigned IPA)
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      xcode: latest

    scripts:
      - name: Install XcodeGen
        script: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

      - name: Generate Xcode project
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          xcodegen generate --spec project.yml
          test -f EquicordApp.xcodeproj/project.pbxproj

      - name: Build unsigned app
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"

          xcodebuild \
            -project EquicordApp.xcodeproj \
            -scheme EquicordApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$CM_BUILD_DIR/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

          test -d "$CM_BUILD_DIR/build/Build/Products/Release-iphoneos/EquicordApp.app"

      - name: Package unsigned IPA
        script: |
          set -euo pipefail

          APP_PATH="$CM_BUILD_DIR/build/Build/Products/Release-iphoneos/EquicordApp.app"

          rm -rf "$CM_BUILD_DIR/build/ipa"
          mkdir -p "$CM_BUILD_DIR/build/ipa/Payload"

          cp -R "$APP_PATH" "$CM_BUILD_DIR/build/ipa/Payload/EquicordApp.app"

          rm -rf "$CM_BUILD_DIR/build/ipa/Payload/EquicordApp.app/_CodeSignature"
          rm -f "$CM_BUILD_DIR/build/ipa/Payload/EquicordApp.app/embedded.mobileprovision"

          cd "$CM_BUILD_DIR/build/ipa"
          zip -qry EquicordApp-unsigned.ipa Payload
          rm -rf Payload

          echo "========================================"
          echo "UNSIGNED IPA CREATED:"
          ls -lh "$CM_BUILD_DIR/build/ipa/EquicordApp-unsigned.ipa"
          echo "========================================"

    artifacts:
      - build/ipa/*.ipa
