workflows:
  ios-equicord-build:
    name: Build Equicord iOS Mobile UI (.ipa)
    max_build_duration: 30
    instance_type: mac_mini_m1

    environment:
      xcode: latest

    scripts:
      - name: Install XcodeGen
        script: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

      - name: Generate Xcode project
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          xcodegen generate --spec project.yml
          test -f EquicordApp.xcodeproj/project.pbxproj

      - name: Build unsigned iOS app
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          rm -rf build Payload EquicordApp.ipa

          xcodebuild             -project EquicordApp.xcodeproj             -scheme EquicordApp             -configuration Release             -sdk iphoneos             -derivedDataPath "$CM_BUILD_DIR/build"             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             CODE_SIGN_IDENTITY=""             clean build

          APP_PATH="$CM_BUILD_DIR/build/Build/Products/Release-iphoneos/EquicordApp.app"
          test -d "$APP_PATH"

          mkdir -p "$CM_BUILD_DIR/Payload"
          cp -R "$APP_PATH" "$CM_BUILD_DIR/Payload/"
          cd "$CM_BUILD_DIR"
          /usr/bin/zip -qry EquicordApp.ipa Payload

          test -f EquicordApp.ipa
          ls -lh EquicordApp.ipa

    artifacts:
      - EquicordApp.ipa
      - build/Build/Products/Release-iphoneos/*.app
