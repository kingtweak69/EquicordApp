workflows:
  ios-equicord-build:
    name: Build Equicord iOS (.ipa)
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      node: latest
      xcode: latest
    scripts:
      - name: Build Web Bundle & Package
        script: |
          corepack enable
          pnpm install
          pnpm buildWeb
          cp dist/browser.js EquicordApp/equicord.user.js
      - name: Build Unsigned .ipa
        script: |
          xcodebuild build \
            -project "EquicordApp.xcodeproj" \
            -scheme "EquicordApp" \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
          mkdir -p Payload
          mv EquicordApp/build/Release-iphoneos/EquicordApp.app Payload/
          zip -r EquicordApp.ipa Payload
    artifacts:
      - "*.ipa"
